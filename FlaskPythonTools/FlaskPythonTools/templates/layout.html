<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - My Flask Application</title>
    <link rel="stylesheet" type="text/css" href="/static/content/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="/static/content/site.css" />
    <script src="/static/scripts/modernizr-2.6.2.js"></script>
</head>

<body>
    <header class="app-header">
        <div class="navbar navbar-inverse navbar-fixed-top">
            <div class="container">
                <div class="navbar-top">
                    <div class="navbar-header">
                        <a href="/" class="navbar-brand">Application name</a>
                    </div>
                    <div class="nav-right">
                        <ul class="nav navbar-nav">
                            <li><a href="{{ url_for('about') }}">About</a></li>
                            <li><a href="{{ url_for('contact') }}">Contact</a></li>
                        </ul>
                    </div>
                </div>

                <div class="navbar-bottom">
                    <div class="nav-left">
                        <ul class="nav navbar-nav">
                            <li><a href="{{ url_for('home') }}">Home</a></li>
                        </ul>
                        <ul class="nav navbar-nav nav-editor">
                            <li><a href="{{ url_for('edit_audio') }}">Audio</a></li>
                            <li><a href="{{ url_for('edit_image') }}">Image</a></li>
                            <li><a href="{{ url_for('photocube') }}">Photo 3D</a></li>
                            <li><a href="{{ url_for('box_rotate') }}">Box 3D</a></li>
                            <li><a href="{{ url_for('face_rotate') }}">Face 3D</a></li>
                            <li><a href="{{ url_for('vector') }}">Map 3D</a></li>
                            <li><a href="{{ url_for('audiowavformfrommic') }}">Record Mic</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="gap">
    </div>
    <div class="gap">
    </div>

    <div class="container body-content">
        {% block content %}{% endblock %}
        <hr />
        <footer>
            <p>&copy; {{ year }} - My Flask Application</p>
        </footer>
    </div>

    <script src="/static/scripts/jquery-1.10.2.js"></script>
    <script src="/static/scripts/bootstrap.js"></script>
    <script src="/static/scripts/respond.js"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
